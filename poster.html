<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Poster Edukasi</title>
</head>
<body style="margin: 0; padding: 20px 14px; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f0f6f4; color: #1b2e26;">

  <div style="max-width: 480px; margin: 0 auto;">

    <!-- Header -->
    <div style="background-color: #0d8a6a; color: #ffffff; padding: 22px 18px; border-radius: 16px; text-align: center; margin-bottom: 18px; box-shadow: 0 6px 18px rgba(13, 138, 106, 0.16);">
      <div style="display: inline-block; background-color: rgba(255, 255, 255, 0.18); padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;">
        KARYA POSTER
      </div>
      <h1 style="margin: 0 0 6px 0; font-size: 21px; font-weight: 800; line-height: 1.3;">
        Poster Peduli Lingkungan &amp; Biologi
      </h1>
      <p style="margin: 0; font-size: 13px; color: #e2f7ef;">
        Selamatkan Penyu Selamatkan Bumi &amp; Apa Itu Sel Punca?
      </p>
    </div>

    <!-- Poster 1: Peduli Lingkungan -->
    <div style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06); border: 1.5px solid #cde8dd; margin-bottom: 18px;">
      <div style="padding: 14px 16px; border-bottom: 1px solid #e6f2ed;">
        <span style="font-size: 11px; font-weight: 700; color: #0d8a6a; text-transform: uppercase; letter-spacing: 0.5px;">Poster 1 &bull; Peduli Lingkungan</span>
        <h2 style="margin: 2px 0 0 0; font-size: 16px; font-weight: 700; color: #1b2e26;">Selamatkan Penyu Selamatkan Bumi!</h2>
      </div>

      <div style="background-color: #f8fbfa; padding: 12px; text-align: center;">
        <iframe
          src="https://drive.google.com/file/d/1oyRKVAW9go4J1ev5TnRdQV68YpkfdXC_/preview"
          style="width: 100%; height: 520px; border: none; border-radius: 10px; background-color: #e9f3ef;"
          allow="autoplay">
        </iframe>
      </div>

      <div style="padding: 12px 16px 16px 16px; text-align: center;">
        <a href="https://drive.google.com/file/d/1oyRKVAW9go4J1ev5TnRdQV68YpkfdXC_/view?usp=drivesdk" target="_blank" style="display: block; background-color: #0d8a6a; color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 8px;">
          Buka Poster di Google Drive
        </a>
      </div>
    </div>

    <!-- Poster 2: Sel Punca -->
    <div style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06); border: 1.5px solid #cde0f5; margin-bottom: 20px;">
      <div style="padding: 14px 16px; border-bottom: 1px solid #e8f0fa;">
        <span style="font-size: 11px; font-weight: 700; color: #1b6ca8; text-transform: uppercase; letter-spacing: 0.5px;">Poster 2 &bull; Biologi</span>
        <h2 style="margin: 2px 0 0 0; font-size: 16px; font-weight: 700; color: #1b2e26;">Apa Itu Sel Punca?</h2>
      </div>

      <div style="background-color: #f7faff; padding: 12px; text-align: center;">
        <iframe
          src="https://drive.google.com/file/d/1k2WUa6mcVH--buXFzsd_bzpuF2NeL9BS/preview"
          style="width: 100%; height: 520px; border: none; border-radius: 10px; background-color: #e6effa;"
          allow="autoplay">
        </iframe>
      </div>

      <div style="padding: 12px 16px 16px 16px; text-align: center;">
        <a href="https://drive.google.com/file/d/1k2WUa6mcVH--buXFzsd_bzpuF2NeL9BS/view?usp=drivesdk" target="_blank" style="display: block; background-color: #1b6ca8; color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 8px;">
          Buka Poster di Google Drive
        </a>
      </div>
    </div>

    <!-- Tombol Kembali -->
    <div style="text-align: center; margin-bottom: 10px;">
      <a href="index.html" style="display: inline-block; background-color: #2c3e50; color: #ffffff; text-decoration: none; font-size: 13.5px; font-weight: 700; padding: 11px 24px; border-radius: 10px;">
        &larr; Kembali ke Portofolio
      </a>
    </div>

  </div>

</body>
</html>
